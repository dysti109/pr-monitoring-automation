<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PR 누적 히스토리</title>
    <style>
      :root { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; color: #2d2824; background: #f6f2eb; }
      body { margin: 0; }
      header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; flex-wrap: wrap; gap: 16px; padding: 18px 28px; background: #fffaf4; border-bottom: 1px solid #ded5ca; }
      header a { color: #76513d; text-decoration: none; font-size: 13px; }
      h1 { margin: 0; font-size: 22px; }
      main { max-width: 1180px; margin: 24px auto; padding: 0 22px 60px; }
      .status, .card { background: #fff; border-radius: 14px; box-shadow: 0 2px 10px #5d463218; }
      .status { padding: 40px; text-align: center; color: #746b63; }
      .hero { padding: 22px; margin-bottom: 16px; }
      .hero h2 { margin: 0 0 8px; font-size: 18px; color: #7b3f2e; }
      .muted { color: #746b63; font-size: 13px; }
      .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 16px 0; }
      .metric { padding: 16px; background: #f3eee8; border-radius: 10px; text-align: center; }
      .metric strong { display: block; font-size: 24px; color: #51382f; }
      .metric span { font-size: 12px; color: #746b63; }
      .candidate-names { display: block; margin-top: 6px; color: #51382f; font-size: 11px; line-height: 1.45; overflow-wrap: anywhere; }
      .candidate-issue-topics { display: block; margin-top: 3px; color: #746b63; font-size: 11px; line-height: 1.45; }
      .candidate-search, .primary-pr-search input, .primary-pr-search-controls input { border: 1px solid #e5d9ce; border-radius: 8px; padding: 7px 9px; background: #fff; color: #2d2824; font: inherit; font-size: 12px; }
      .candidate-search { width: min(320px, 100%); margin: 0 0 10px; }
      .candidate-scope-note { margin: -4px 0 12px; }
      .candidate-source-links details { margin-top: 4px; }
      .candidate-source-links summary { color: #76513d; cursor: pointer; font-size: 12px; }
      .columns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
      .card { padding: 20px; margin-bottom: 16px; }
      .card h3 { margin: 0 0 12px; color: #7b3f2e; font-size: 16px; }
      .insight-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .insight { padding: 15px 16px; border: 1px solid #eadfd5; border-left: 4px solid #b26d4f; border-radius: 10px; background: #fffaf6; }
      .insight.high { border-left-color: #c33b32; background: #fff5f3; }
      .insight h4 { margin: 0 0 7px; color: #6e3e2b; font-size: 14px; }
      .insight p { margin: 0; line-height: 1.65; font-size: 13px; }
      .badge { float: right; padding: 3px 7px; border-radius: 999px; background: #eee4dc; color: #76513d; font-size: 11px; }
      .badge.high { background: #ffdcd7; color: #9a211d; }
      .repeat-description { margin: 5px 0 2px; color: #514941; line-height: 1.6; }
      .repeat-company-list { margin: 0; padding-left: 20px; line-height: 1.6; font-size: 13px; }
      .repeat-company-list > li { margin: 0 0 12px; }
      .repeat-topic-list { margin: 4px 0 0; padding-left: 20px; line-height: 1.6; }
      .repeat-topic-list > li { margin: 5px 0 0; }
      .repeat-topic-link { color: #76513d; font-weight: 500; text-decoration: none; }
      .repeat-topic-link:hover { color: #9a4d32; text-decoration: underline; text-decoration-color: #d8c2b2; text-underline-offset: 3px; }
      .reporter-outlet-list { color: #746b63; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
      .reporter-ranking-table th:nth-child(2), .reporter-ranking-table th:nth-child(3) { white-space: nowrap; }
      .reporter-summary { min-width: 0; }
      .primary-topic-link { color: #76513d; font-weight: 700; text-decoration: underline; text-decoration-color: #d8c2b2; text-underline-offset: 3px; }
      .primary-topic-link:hover { color: #9a4d32; }
      .primary-pr-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 14px; }
      .primary-pr-group { min-width: 0; }
      .primary-pr-group > b { display: block; padding-bottom: 6px; border-bottom: 1px solid #ece7e1; color: #6d5a4e; }
      .primary-pr-group ul { padding-left: 18px; }
      .primary-pr-group li { margin: 6px 0 10px; overflow-wrap: anywhere; }
      .primary-pr-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin: 14px 0 8px; }
      .primary-pr-toolbar p { margin: 0; }
      .primary-pr-search-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
      .primary-pr-search-controls label { display: inline-flex; align-items: center; gap: 5px; color: #746b63; font-size: 11px; }
      .primary-pr-search-controls input[type="search"] { width: min(250px, 100%); }
      .primary-pr-search-controls input[type="date"] { width: 128px; }
      .primary-pr-filter { display: flex; flex-wrap: wrap; gap: 6px; }
      .primary-pr-filter button { border: 1px solid #e5d9ce; border-radius: 999px; padding: 6px 11px; background: #fff; color: #6d5a4e; font: inherit; font-size: 12px; cursor: pointer; }
      .primary-pr-filter button[aria-pressed="true"] { border-color: #7b3f2e; background: #7b3f2e; color: #fff; }
      .primary-article-table-wrap { overflow-x: auto; border: 1px solid #eee6de; border-radius: 10px; }
      .primary-article-table { min-width: 760px; }
      .primary-article-more { display: block; margin: 10px auto 0; border: 1px solid #e5d9ce; border-radius: 999px; padding: 7px 14px; background: #fff; color: #76513d; font: inherit; font-size: 12px; cursor: pointer; }
      .primary-article-more:hover { background: #faf7f3; }
      .primary-article-table th { background: #faf7f3; white-space: nowrap; }
      .primary-article-table td { padding: 12px 10px; }
      .primary-article-date { min-width: 112px; white-space: nowrap; color: #746b63; font-size: 12px; }
      .primary-article-source { min-width: 150px; }
      .primary-article-source strong, .primary-article-source small { display: block; }
      .primary-article-source small, .primary-article-material small { margin-top: 4px; color: #746b63; font-size: 11px; }
      .primary-source-badge, .primary-signal { display: inline-block; border-radius: 999px; padding: 3px 7px; background: #f1ebe5; color: #76513d; font-size: 11px; white-space: nowrap; }
      .primary-article-material { min-width: 260px; line-height: 1.5; }
      .primary-article-material a { color: #51382f; font-weight: 700; text-decoration-color: #d8c2b2; text-underline-offset: 3px; }
      .primary-article-summary { display: block; margin-top: 7px; color: #514941; font-size: 12px; line-height: 1.55; white-space: normal; }
      .primary-report-overview { margin: 14px 0 10px; padding: 12px 14px; border-radius: 10px; background: #faf7f3; color: #514941; font-size: 12px; line-height: 1.6; }
      .primary-report-topics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      .primary-report-topic { display: inline-block; max-width: 100%; box-sizing: border-box; border-radius: 999px; padding: 4px 8px; background: #eee6df; color: #614637; font-size: 11px; white-space: normal; overflow-wrap: anywhere; }
      .primary-reputation-cell { min-width: 145px; }
      .primary-signal + .primary-signal { margin-left: 4px; }
      .primary-signal.positive { background: #e9f3ec; color: #28623d; }
      .primary-signal.neutral { background: #f1eee9; color: #62594f; }
      .primary-signal.caution { background: #fff0d9; color: #8b5900; }
      .primary-signal.negative { background: #ffe2df; color: #a42a22; }
      .primary-reputation-cell small { display: block; margin-top: 5px; color: #746b63; line-height: 1.45; }
      .primary-extra-coverage { display: block; margin-top: 5px; color: #746b63; font-size: 11px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { padding: 9px 7px; border-top: 1px solid #ece7e1; text-align: left; vertical-align: top; }
      th { color: #6d5a4e; font-size: 12px; }
      td.num { text-align: center; width: 70px; }
      ul { margin: 0; padding-left: 20px; line-height: 1.7; font-size: 13px; }
      .empty { color: #746b63; font-size: 13px; }
      @media (max-width: 760px) { .grid, .columns, .insight-grid, .primary-pr-groups { grid-template-columns: 1fr; } header { padding: 15px 18px; } main { padding: 0 14px 40px; } }
    </style>
  </head>
  <body>
    <header><a href="/">기사 목록</a><h1>주 대상 평판·PR 누적 히스토리</h1></header>
    <main id="content" class="status">누적 데이터를 불러오는 중입니다.</main>
    <script>
      const content = document.querySelector('#content');
      const esc = (value = '') => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const reputationTopicLabel = (name, articleTitle = '') => {
        const rawName = String(name || '').trim();
        let label = /^[a-z0-9_-]+$/i.test(rawName) && articleTitle ? String(articleTitle) : rawName;
        label = label.replace(/^\s*(?:\[[^\]]+\]\s*)+/, '').replace(/[“”‘’"']/g, '')
          .replace(/(?:…|\.{2,}).*$/, '')
          .replace(/\s*(?:밝혔다|전했다|보도했다|소개했다|설명했다|추진한다|확대한다|강화한다|도입한다|확장한다|운영한다|제공한다|출시했다|수주했다|모집한다|했습니다|합니다|했다|한다|됐다|된다|예정이다|계획이다|[^\s.!?。]+다|[^\s.!?。]+요|[^\s.!?。]+죠)[.!?。]*$/, '')
          .replace(/[.!?。]+$/, '').trim();
        if (/[가-힣]/.test(label) && label.length <= 36 && !/(?:다|요|죠|습니다)[.!?。]*$/.test(label)) return label;
        return /[가-힣]/.test(label) ? label.slice(0, 36).trim() : (rawName || '소재 미분류');
      };
      const repeatedTopicLabel = item => {
        if (item.displayTopicLabel) return item.displayTopicLabel;
        const key = String(item.topicKey || '').trim();
        if (/[가-힣]/.test(key) && key.length <= 32 && !/(?:관련|주요|동향)/.test(key) && !/(?:다|요|죠|습니다)[.!?。]*$/.test(key)) return key.replace(/[.!?。]+$/, '');
        const company = String(item.company || '').trim();
        const description = String(item.description || '').trim();
        const withoutCompany = company && description.startsWith(company)
          ? description.slice(company.length).replace(/^(?:은|는|이|가|의)?\s*/, '')
          : description;
        const nounSummary = withoutCompany.replace(/\s*(?:밝혔다|소개했다|발표했다|운영한다|제공한다|공급했다|구축한다|확대한다|도입했다|체결했다|선정됐다|인수했다|수상했다|전했다|보도했다|설명했다|[^\s.!?。]+다|[^\s.!?。]+요|[^\s.!?。]+죠)\.?$/, '').trim();
        if (/[가-힣]/.test(nounSummary) && nounSummary.length <= 38) return nounSummary;
        const headline = String(item.representativeTitle || '').trim();
        const headlineLabel = company && headline.startsWith(company)
          ? headline.slice(company.length).replace(/^[,，\s]+/, '')
          : headline;
        const cleanedHeadline = headlineLabel.replace(/[“”‘’"']/g, '').replace(/\s*(?:밝혔다|추진한다|확대한다|도입한다|제공한다|체결했다|설명했다)[.!?。]*$/, '').trim();
        return /[가-힣]/.test(cleanedHeadline) ? cleanedHeadline.slice(0, 38) : '소재명 확인 필요';
      };
      const repeatedTopicLink = item => esc(repeatedTopicLabel(item));
      const repeatedTopicArticleLink = item => {
        const label = esc(repeatedTopicLabel(item));
        const matchedArticle = (item.sourceArticles || []).find(article => article.title === item.representativeTitle && /^https?:\/\//i.test(String(article.url || '')));
        const url = /^https?:\/\//i.test(String(item.representativeUrl || '')) ? String(item.representativeUrl) : String(matchedArticle?.url || '');
        return url ? `<a class="repeat-topic-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer" title="대표 기사: ${esc(item.representativeTitle || label)}">${label}</a>` : `<span class="repeat-topic-link">${label}</span>`;
      };
      const rows = (items, kind) => (items || []).slice(0, 10).map(item => {
        const count = kind === 'company' ? item.issueCount : item.count;
        const exposure = kind === 'company' ? item.exposureCount : '';
        return `<tr><td>${esc(item.name || '')}</td><td class="num">${esc(count ?? '')}</td><td class="num">${esc(exposure)}</td></tr>`;
      }).join('');
      const sourceLinks = items => {
        const links = (items || []).filter(item => /^https?:\/\//i.test(String(item.url || ''))).map(item => {
          const label = item.publisher ? `${item.publisher} 원문` : '기사 원문';
          return `<a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer" title="${esc(item.title || label)}">${esc(label)}</a>`;
        });
        if (links.length < 2) return links[0] || '';
        return `<div class="candidate-source-links">${links[0]}<details><summary>추가 원문 ${links.length - 1}건</summary>${links.slice(1).join('<br>')}</details></div>`;
      };
      const primaryTopicRow = topic => {
        const label = reputationTopicLabel(topic.name);
        const article = topic.representativeArticle || topic.sourceArticles?.[0];
        const safeUrl = /^https?:\/\//i.test(String(article?.url || '')) ? String(article.url) : '';
        const title = String(article?.title || label);
        const normalizeText = value => String(value || '').toLowerCase().replace(/[\s\p{P}\p{S}]/gu, '');
        const titleText = normalizeText(title);
        const labelText = normalizeText(label);
        const showTopicLabel = labelText && !titleText.includes(labelText) && !labelText.includes(titleText);
        const titleMarkup = safeUrl
          ? `<a class="primary-topic-link" href="${esc(safeUrl)}" target="_blank" rel="noopener noreferrer" title="대표 기사: ${esc(title)}">${esc(title)}</a>`
          : esc(label);
        const topicContext = showTopicLabel ? `${esc(label)} · ` : '';
        const publisher = article?.publisher ? ` · ${esc(article.publisher)}` : '';
        return `<li>${titleMarkup}<div class="muted">${topicContext}${esc(topic.count)}건${publisher}</div></li>`;
      };
      const formatKstDate = value => {
        let source = String(value || '').trim();
        if (!source) return '날짜 확인 불가';
        source = source.replace(/(?:\s|\[)(?:Asia\/Seoul|KST)\]?\s*$/i, '').replace(/\s+(UTC|GMT)$/i, 'Z').replace(' ', 'T');
        if (!/(?:Z|[+-]\d{2}:?\d{2})$/i.test(source)) source += '+09:00';
        const date = new Date(source);
        if (Number.isNaN(date.getTime())) return String(value).replace(/\s+(Asia\/Seoul|KST)$/i, '');
        const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(date).map(part => [part.type, part.value]));
        return parts.year + '-' + parts.month + '-' + parts.day + ' ' + parts.hour + ':' + parts.minute;
      };
      const primaryArticleRows = items => (items || []).map((item, index) => {
        const safeUrl = /^https?:\/\//i.test(String(item.url || '')) ? String(item.url) : '';
        const isOwnedBlog = item.sourceLabel === '자사 블로그 글';
        const isOnlinePost = item.sourceLabel === '온라인 게시글';
        const displayTitle = String(item.title || (safeUrl ? '원문 보기' : '제목 확인 불가')).replace(/^\s*(?:\[자사 블로그 글\]\s*)+/g, '').trim();
        const title = safeUrl ? '<a href="' + esc(safeUrl) + '" target="_blank" rel="noopener noreferrer">' + esc(displayTitle) + '</a>' : esc(displayTitle);
        const reporter = String(item.reporter || '').trim() || '기자 정보 없음';
        const tone = String(item.tone || '판단 보류');
        const risk = String(item.reputationRisk || '판단 보류');
        const toneClass = tone === '우호' ? 'positive' : tone === '비판' ? 'negative' : tone === '판단 보류' ? 'caution' : 'neutral';
        const riskClass = risk === '높음' ? 'negative' : risk === '중간' ? 'caution' : risk === '낮음' ? 'positive' : 'neutral';
        const isEditorialCoverage = item.sourceLabel === '언론 보도' || item.sourceLabel === '공시·기관';
        const fullSummary = isEditorialCoverage ? String(item.contentSummary || '').replace(/\s+/g, ' ').trim() : '';
        const sentenceEnd = fullSummary.search(/[.!?。](?:\s|$)/);
        const summary = (sentenceEnd >= 0 ? fullSummary.slice(0, sentenceEnd + 1) : fullSummary)
          .replace(/^(?:외부 언론은|자사 공식 발신:)\s*/, '')
          .replace(/하였습니다(?=\.|$)/g, '한다')
          .replace(/했습니다(?=\.|$)/g, '한다')
          .replace(/합니다(?=\.|$)/g, '한다')
          .replace(/입니다(?=\.|$)/g, '이다')
          .replace(/있습니다(?=\.|$)/g, '있다')
          .replace(/보입니다(?=\.|$)/g, '보인다');
        const summaryMarkup = summary ? '<span class="primary-article-summary">' + esc(summary) + '</span>' : '';
        const reason = String(item.reputationReason || '').trim();
        const hideRiskAssessment = isOwnedBlog || isOnlinePost;
        const isLowConcern = ['우호', '중립'].includes(tone) && ['낮음', '해당 없음'].includes(risk);
        const riskMarkup = hideRiskAssessment ? '' : '<span class="primary-signal ' + riskClass + '">위험 ' + esc(risk) + '</span>';
        const reasonMarkup = !hideRiskAssessment && !isLowConcern && reason ? '<small>' + esc(reason) + '</small>' : '';
        const sourceGroup = isOwnedBlog ? 'owned-blog' : isOnlinePost ? 'online' : 'media';
        const dateLabel = formatKstDate(item.publishedAt);
        const searchText = [item.title, item.publisher, reporter, item.topic, item.contentSummary, dateLabel].join(' ').toLocaleLowerCase('ko-KR');
        return '<tr data-index="' + index + '" data-source="' + sourceGroup + '" data-date="' + esc(dateLabel.slice(0, 10)) + '" data-search="' + esc(searchText) + '"><td class="primary-article-date">' + esc(dateLabel) + '</td><td class="primary-article-source"><span class="primary-source-badge">' + esc(item.sourceLabel || '출처 미분류') + '</span><strong style="margin-top:5px">' + esc(item.publisher || '매체 확인 불가') + '</strong><small>' + esc(reporter) + '</small></td><td class="primary-article-material">' + title + summaryMarkup + '</td><td class="primary-reputation-cell"><span class="primary-signal ' + toneClass + '">' + esc(tone) + '</span>' + riskMarkup + reasonMarkup + '</td></tr>';
      }).join('');
      const reporterMinimumCount = 5;
      const reporterRows = items => (items || []).filter(item => Number(item.count || 0) >= reporterMinimumCount).slice(0, 10).map(item => {
        const contacts = (item.contacts || []).map(contact => {
          const value = String(contact.value || '').trim();
          const href = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)
            ? `mailto:${value}`
            : /^\+?[\d ()-]{7,}$/.test(value) ? `tel:${value.replace(/[^+\d]/g, '')}` : '';
          const contactLabel = href ? `<a href="${esc(href)}">${esc(value)}</a>` : esc(value);
          const sourceUrl = /^https?:\/\//i.test(String(contact.url || '')) ? String(contact.url) : '';
          const sourceLink = sourceUrl ? ` <a href="${esc(sourceUrl)}" target="_blank" rel="noopener noreferrer">출처</a>` : '';
          return `<span>${contactLabel}${sourceLink}</span>`;
        }).join('<br>');
        const publishers = item.publishers || [];
        const publisherSummary = publishers.length
          ? `<span class="reporter-outlet-list">${publishers.slice(0, 3).map(publisher => `${esc(publisher.name)} ${esc(publisher.count)}건`).join(' · ')}</span>`
          : '<span class="muted">매체 정보 없음</span>';
        return `<tr><td>${esc(item.name || '')}${contacts ? `<br><small>${contacts}</small>` : ''}</td><td colspan="2"><div class="reporter-summary">${publisherSummary}</div></td></tr>`;
      }).join('');
      function render(data) {
        const companies = rows(data.companies, 'company');
        const mediaMinimumCount = 10;
        const mediaEntries = (data.media || []).filter(item => Number(item.count || 0) >= mediaMinimumCount);
        const reporterEntries = (data.reporters || []).filter(item => Number(item.count || 0) >= reporterMinimumCount);
        const media = rows(mediaEntries, 'media');
        const reporters = reporterRows(reporterEntries);
        const repeatMinimumArticleCount = 5;
        const repeatedIssueGroups = new Map();
        for (const item of (data.repeatedIssues || []).filter(item => item.collectionGroup !== 'A')) {
          let displayTopicLabel = repeatedTopicLabel(item);
          let identityLabel = displayTopicLabel;
          const identity = identityLabel.normalize('NFKC').toLocaleLowerCase('ko-KR').replace(/[\s·ㆍ,，:：;；/＿_-]/g, '');
          const groupKey = `${item.company}|${identity}`;
          const group = repeatedIssueGroups.get(groupKey) || { ...item, displayTopicLabel, coverageCount: 0 };
          group.coverageCount += Number(item.coverageCount || 0);
          if (!group.representativeUrl && item.representativeUrl) {
            group.representativeUrl = item.representativeUrl;
            group.representativeTitle = item.representativeTitle;
            group.sourceArticles = item.sourceArticles || [];
          }
          repeatedIssueGroups.set(groupKey, group);
        }
        const repeatedIssues = [...repeatedIssueGroups.values()].filter(item => item.coverageCount >= repeatMinimumArticleCount).sort((a, b) => b.coverageCount - a.coverageCount || a.company.localeCompare(b.company, 'ko'));
        const leadingRepeat = repeatedIssues[0];
        const insightItems = (data.insights || []).filter(item => item.type !== 'repeat');
        if (leadingRepeat) insightItems.push({ type: 'repeat', title: '반복 보도 소재', repeatItem: leadingRepeat, priority: '보통' });
        const insights = insightItems.map(item => {
          const detail = item.repeatItem

          candidateCard.className = 'card';
          candidateCard.innerHTML = `<h3>신규 모니터링 후보 (${esc((data.candidates || []).length)})</h3><div class="muted candidate-scope-note">기준 기간: ${esc(historyScope)} · 이슈는 서로 다른 보도 주제 수, 노출은 개별 기사 수입니다.</div>${candidateRows ? `<input class="candidate-search" type="search" placeholder="기업·소재 검색" aria-label="기업·소재 검색"><table><thead><tr><th>기업</th><th>이슈</th><th>노출</th><th>선정 이유</th><th>원문</th></tr></thead><tbody>${candidateRows}</tbody></table>` : '<div class="empty">현재 신규 모니터링 후보가 없습니다.</div>'}`;
          candidateSection.parentElement?.after(candidateCard);
          const candidateSearchInput = candidateCard.querySelector('.candidate-search');
          candidateSearchInput?.addEventListener('input', () => {
            const query = String(candidateSearchInput.value || '').trim().toLocaleLowerCase('ko-KR');
            candidateCard.querySelectorAll('tbody tr[data-search]').forEach(row => {
              row.hidden = Boolean(query) && !String(row.dataset.search || '').includes(query);
            });
          });
        }
      }
      fetch('/api/competitor-insights').then(response => { if (!response.ok) throw new Error('분석 서버가 실행 중이 아닙니다.'); return response.json(); }).then(render).catch(error => { content.textContent = `${error.message} 먼저 PR 분석 서버를 실행해 주세요.`; });
    </script>
  </body>
</html>
